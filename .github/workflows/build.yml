name: Build LiquidGlassHook

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install dpkg ldid xz

      - name: Setup Theos
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Extract SDK from Xcode
        run: |
          export THEOS="$HOME/theos"
          mkdir -p "$THEOS/sdks"
          # 从 GitHub Actions 自带的 Xcode 中提取 SDK
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(basename "$SDK_PATH" | sed 's/iPhoneOS//;s/\.sdk//')
          echo "Found SDK: $SDK_VERSION"
          cp -r "$SDK_PATH" "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

      - name: Set Environment Variables
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build Tweak
        run: |
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1
          ls -la packages/

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassHook.deb
          path: packages/*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}