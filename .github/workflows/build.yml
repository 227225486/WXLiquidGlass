name: Build WCGlassLiquid
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y clang lld git make curl libxml2-dev unzip wget

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      # 下载 iOS26 SDK
      - name: Download iOS26 SDK
        run: |
          cd $HOME/theos/sdks
          curl -L -O https://mirror.ghproxy.com/https://github.com/theos/sdks/raw/master/iPhoneOS26.0.sdk.tar.xz
          tar -xf iPhoneOS26.0.sdk.tar.xz

      - name: Build tweak
        run: |
          make package

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          path: debs/*.deb