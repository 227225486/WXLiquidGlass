name: Build WCGlassLiquid
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:latest
      options: --dns 1.1.1.1 --dns 8.8.8.8
    env:
      THEOS: /home/builder/theos
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: /home/builder/theos
          key: debian-theos-v3

      - name: Install debian dependencies & create builder user
        run: |
          apt update
          apt install -y bash curl git make perl xz-utils ca-certificates sudo unzip
          useradd -m builder
          usermod -aG sudo builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Clone Theos (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          su - builder -c "
            git clone --recursive https://ghproxy.com/https://github.com/theos/theos.git ~/theos
          "

      - name: Download Linux iPhone toolchain via ghproxy
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          su - builder -c "
            cd ~/theos
            mkdir -p toolchain/linux/iphone
            cd toolchain/linux/iphone
            curl -L --fail https://ghproxy.com/https://github.com/theos/toolchain/releases/download/2024.04/ios-toolchain-linux-2024.04.tar.xz -o toolchain.tar.xz
            tar -xf toolchain.tar.xz
            rm toolchain.tar.xz
          "

      - name: Build tweak
        run: |
          su - builder -c "
            export THEOS=/home/builder/theos
            export PATH=\$THEOS/bin:\$PATH
            cd $GITHUB_WORKSPACE
            make package FINALPACKAGE=1
          "

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: debs/*.deb