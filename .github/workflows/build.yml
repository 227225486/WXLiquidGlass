name: Build WeChat LiquidGlass Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: macos-14 # 使用最新的 macOS runner，支持较新的 SDK
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "export THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS SDK (Optional but recommended for stability)
        run: |
          # 这里我们假设你的代码只依赖标准 UIKit，通常不需要额外 SDK 
          # 如果报错，可以取消下面注释并替换为你需要的 SDK 版本
          # curl -L "https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS16.5.sdk.tar.xz" -o /tmp/sdk.tar.xz
          # tar xf /tmp/sdk.tar.xz -C $HOME/theos/sdks/

      - name: Build Tweak
        run: |
          cd $THEOS
          make package
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: LiquidGlass.deb
          path: packages/*.deb
