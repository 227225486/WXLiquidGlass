name: Build WCGlassLiquid
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:latest
    env:
      THEOS: /home/builder/theos
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: /home/builder/theos
          key: debian-theos-v1

      - name: Install debian dependencies
        run: |
          apt update
          apt install -y bash curl git make perl xz-utils ca-certificates sudo
          # 创建普通用户 builder
          useradd -m builder
          usermod -aG sudo builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Install Theos (non-root builder user)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          su - builder -c "curl -fsSL https://cdn.jsdelivr.net/gh/theos/theos@master/bin/install-theos > ~/install-theos.sh; chmod +x ~/install-theos.sh; bash ~/install-theos.sh"

      - name: Build tweak as builder
        run: |
          su - builder -c "
            export THEOS=/home/builder/theos
            export PATH=\$THEOS/bin:\$PATH
            cd $GITHUB_WORKSPACE
            make package FINALPACKAGE=1
          "

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: debs/*.deb