name: Build WCGlassLiquid
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download prebuilt ldid
        run: |
          curl -L -o ldid https://github.com/theos/ldid/releases/latest/download/ldid-macos
          chmod +x ldid
          mkdir -p $HOME/theos/bin
          mv ldid $HOME/theos/bin/
          export PATH="$HOME/theos/bin:$PATH"

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          export PATH="$HOME/theos/bin:$PATH"

      - name: Build Tweak
        run: |
          make package

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          path: debs/*.deb