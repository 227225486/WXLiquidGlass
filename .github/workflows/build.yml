name: Build WCGlassLiquid
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 现成封装好的Theos Action，自动拉完整theos，自带工具链
      - name: Setup Theos
        uses: hbang/setup-theos@v1

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: debs/*.deb