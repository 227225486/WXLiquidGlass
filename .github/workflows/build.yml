name: Build WCGlassLiquid
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: /home/builder/theos
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: /home/builder/theos
          key: ubuntu-theos-v4

      - name: Install dependencies & create builder user
        run: |
          sudo apt update
          sudo apt install -y bash curl git make perl xz-utils ca-certificates unzip
          sudo useradd -m builder
          sudo usermod -aG sudo builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/builder

      - name: Clone Theos (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo su - builder -c "
            git clone --recursive https://ghfast.top/https://github.com/theos/theos.git ~/theos
          "

      - name: Download Linux iPhone toolchain via ghfast.top
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo su - builder -c "
            cd ~/theos
            mkdir -p toolchain/linux/iphone
            cd toolchain/linux/iphone
            curl -L --fail https://ghfast.top/https://github.com/theos/toolchain/releases/download/2024.04/ios-toolchain-linux-2024.04.tar.xz -o toolchain.tar.xz
            tar -xf toolchain.tar.xz
            rm toolchain.tar.xz
          "

      - name: Build tweak
        run: |
          sudo su - builder -c "
            export THEOS=/home/builder/theos
            export PATH=\$THEOS/bin:\$PATH
            cd $GITHUB_WORKSPACE
            make package FINALPACKAGE=1
          "

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: debs/*.deb