name: Build WCGlassLiquid
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: ubuntu-theos-v5

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y bash curl git make perl xz-utils ca-certificates

      - name: Install Theos official script (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      # ✅ 编译时手动传入 THEOS 变量给 make
      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: debs/*.deb