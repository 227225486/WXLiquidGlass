name: Build WCGlassLiquid
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos (自动安装toolchain、SDK、ldid)
        uses: theos/setup-theos@v1

      - name: Build Tweak
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: debs/*.deb